# docker-compose.yml — the trading system's signal side.
#
# Three services: Kafka (the message bus), the feed process (bars -> Kafka), and
# the signal process (Kafka -> chains -> trade_signals). Postgres is NOT here —
# it's managed Supabase, reached over the network via TRADING_DB_URL in .env.
#
# Both Python services use the SAME image (built once) with different commands.
# restart: unless-stopped so they survive crashes and VM reboots, matching the
# CausaView deployment posture.
#
# Startup ordering: the feed reads warmup cursors the signal process writes, but
# it does NOT block on the signal process (reads whatever cursors exist, starts
# from "now" if none). So compose can bring them up together; they converge.
# Kafka must be healthy before either Python service tries to connect, hence the
# depends_on + healthcheck.

services:
  kafka:
    image: apache/kafka:3.7.2
    user: "root"
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/tmp/kafka-logs"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  feed:
    build: .
    image: trading-system:latest
    restart: unless-stopped
    command: ["python", "feed_process.py"]
    env_file: .env
    environment:
      # Inside the compose network Kafka is reachable as 'kafka:9092',
      # overriding the .env default of localhost.
      KAFKA_BOOTSTRAP: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
      warmup:
        condition: service_completed_successfully
  signal:
    build: .
    image: trading-system:latest
    restart: unless-stopped
    command: ["python", "signal_process.py"]
    env_file: .env
    # NOT `ports:`. The health/audit endpoints have no authentication of
    # their own, so 8081 is deliberately NOT published to the host — it is
    # reachable only inside the compose network, where the caddy service
    # terminates TLS and checks a bearer token in front of it. Publishing
    # it here would bypass that entirely.
    expose:
      - "8081"
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
      warmup:
        condition: service_completed_successfully
  warmup:
    build: .
    image: trading-system:latest
    command: ["python", "warmup_process.py"]
    restart: "no"
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
  # --- Public, authenticated access to the signal process's read-only
  # health/audit endpoints. See Caddyfile for the reasoning and setup.
  #
  # A downstream team consumes trade_signals and needs to verify pipeline
  # liveness and chain integrity before trusting the signals. Rather than
  # publishing 8081 unauthenticated, this terminates TLS, checks a bearer token,
  # and proxies only the four read-only routes.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # 80 is required for the ACME HTTP challenge (certificate issuance and
      # renewal), not just for redirecting to HTTPS. Restrict BOTH to the
      # consuming team's egress IPs in the cloud firewall.
      - "80:80"
      - "443:443"
    environment:
      HEALTH_PUBLIC_HOST: "${HEALTH_PUBLIC_HOST}"
      HEALTH_BEARER_TOKEN: "${HEALTH_BEARER_TOKEN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. MUST persist, or every container
      # restart re-requests a certificate and will hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - signal

volumes:
  kafka_data:
  caddy_data:
  caddy_config:
